name: Publish Python Package
run-name: Publish ${{ github.event.release.tag_name || inputs.release_tag }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish (for example, v1.0.0)
        required: true
        type: string

jobs:
  verify:
    name: Test and build release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code and tags
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test and build
        run: |
          python -m pip install --upgrade build pytest ruff twine
          python -m pip install -e .
          ruff check uploadassist tests examples
          ruff format --check uploadassist tests examples
          python -m pytest -q
          python -m build
          python -m twine check --strict dist/*
      - name: Verify release version matches tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.version import InvalidVersion, Version
          from zipfile import ZipFile

          tag = os.environ["RELEASE_TAG"].removeprefix("v")
          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one wheel, found {len(wheels)}")
          with ZipFile(wheels[0]) as wheel:
              metadata_name = next(name for name in wheel.namelist() if name.endswith(".dist-info/METADATA"))
              version = next(
                  line.removeprefix("Version: ")
                  for line in wheel.read(metadata_name).decode().splitlines()
                  if line.startswith("Version: ")
              )
          try:
              versions_match = Version(version) == Version(tag)
          except InvalidVersion as error:
              raise SystemExit(f"Invalid release version: {error}") from error
          if not versions_match:
              raise SystemExit(
                  f"Release tag {tag!r} does not match package version {version!r}"
              )
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  publish-pypi-test:
    name: Publish to TestPyPI
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          name: release-dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository_url: https://test.pypi.org/legacy/
          verbose: true

  publish-pypi:
    name: Publish to PyPI
    needs: [verify, publish-pypi-test]
    environment:
      name: prod
      url: https://pypi.org/project/uploadassist/
    runs-on: ubuntu-latest
    if: >-
      ${{ always() && needs.verify.result == 'success' &&
          (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease) }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: release-dist
          path: dist

      - name: Check files
        run: |
          ls dist
        shell: bash

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
